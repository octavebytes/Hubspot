site_name: HubSpot CTI Connector Documentation
site_description: AWS Connect + HubSpot CRM integration by Octavebytes
site_author: Octavebytes
site_url: https://octavebytes.github.io/Hubspot/
copyright: "© 2026 Octavebytes. All Rights Reserved."

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/octavebytes/
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/octavebytes
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/channel/UCA0Le6ELahBzAf-I7jOBuRQ
    - icon: fontawesome/solid/globe
      link: https://octavebytes.com
  generator: false

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Docs:
    - Getting Started:
      - getting-started/index.md
      - Release Notes: getting-started/release-notes.md
    - Deployment & Setup:
      - deployment/index.md
      - Deployment Guide (AWS CloudFormation): deployment/deployment-guide.md
      - Agent Setup Guide: deployment/agent-setup.md
    - User Guides:
      - user-guides/index.md
      - Agent User Guide: user-guides/agent-guide.md
      - WhatsApp Messaging Guide: user-guides/whatsapp-messaging.md
    - Administration:
      - admin/index.md
      - Admin Configuration Guide: admin/configuration-guide.md
    - Support & Troubleshooting:
      - support/index.md
      - Troubleshooting & FAQ: support/troubleshooting.md
    - Solution Security: security/index.md
  - Security: security/index.md
